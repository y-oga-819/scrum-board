name: E2E

# 層4（Playwright）。重いスイートなので単体・契約テスト（ci.yml）とは
# ワークフローを分けるが、**トリガーは PR** にする。
#
# なぜ main ではなく PR か: このリポジトリは **main への push でデプロイ**する
# （deploy.yml）。E2E を main（＝マージ後）で回すと「壊れたものをデプロイして
# から気づく」ことになり、ゲートとして機能しない。動作確認は**マージ前**に済ませる。
# ブランチ保護で必須チェックにして初めて gate になる（docs/setup/ci-branch-protection.md）。
# D-19 の当初案（main マージ時）からの変更で、理由は D-19 の CI 構成メモに追記した。
#
# 各フローは対象画面（M4/M5）が実装されるまで test.fixme で skip される。
# 必須チェックにするため paths フィルタは付けない（フィルタで skip されると必須
# チェックが永久に報告されずマージ不能になるため）。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E flows
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
