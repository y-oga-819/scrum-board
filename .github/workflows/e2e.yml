name: E2E

# 層4（Playwright）。重いスイートなので単体・契約テスト（ci.yml）とは
# ワークフローを分けるが、**トリガーは PR** にする。
#
# なぜ main ではなく PR か: このリポジトリは **main への push でデプロイ**する
# （deploy.yml）。E2E を main（＝マージ後）で回すと「壊れたものをデプロイして
# から気づく」ことになり、ゲートとして機能しない。動作確認は**マージ前**に済ませる。
# ブランチ保護で必須チェックにして初めて gate になる（docs/setup/ci-branch-protection.md）。
# D-19 の当初案（main マージ時）からの変更で、理由は D-19 の CI 構成メモに追記した。
#
# 実行方式（EX-1・D-22）: Cosmos エミュレータを起動し、e2e ビルドの SPA を実 FastAPI が
# 配信する（`make run-e2e`）。認証は env ゲートの resolver でバイパスし、既知の初期状態は
# Playwright の globalSetup が prd_test_<runId> に seeding、globalTeardown が物理削除する。
#
# 未実装画面に依存するフローは test.fixme で skip される。必須チェックにするため paths
# フィルタは付けない（フィルタで skip されると必須チェックが永久に報告されずマージ不能）。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # エミュレータ接続（周知の公開キー・秘密ではない）。app と seeding が同じ値を読む。
      COSMOS_ENDPOINT: https://localhost:8081
      COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      COSMOS_DATABASE: scrumboard-e2e
      # エミュレータは自己署名証明書。app の create_client もここを見て検証を切る（EX-1）。
      COSMOS_TLS_VERIFY: "0"
      # E2E は誰も DB を作らないため、app と seeding が自前で作る（本番は infra 前提で既定 OFF）。
      COSMOS_CREATE_DATABASE: "1"
      # 認証バイパスの固定ユーザーと、このランだけの隔離パーティション（prd_test_<runId>）。
      E2E_AUTH_OID: oid-e2e-ci
      E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # Linux 版 Cosmos エミュレータ。ゲートウェイモード（:8081）・自己署名証明書。
      - name: Start Cosmos DB emulator
        run: |
          docker run -d --name cosmos-emulator \
            -p 8081:8081 -p 10250-10255:10250-10255 \
            -e AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3 \
            -e AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest

      # 固定 sleep ではなく ready ポーリング（D-19）。証明書エンドポイントが 200 を返したら進む。
      - name: Wait for emulator (poll readiness, not fixed sleep)
        run: |
          for i in $(seq 1 60); do
            if curl -ksf https://localhost:8081/_explorer/emulator.pem >/dev/null; then
              echo "emulator ready after ${i} poll(s)"; exit 0
            fi
            echo "polling emulator readiness… (${i}/60)"; sleep 5
          done
          echo "::error::emulator did not become ready in time"
          docker logs cosmos-emulator || true
          exit 1

      # webServer（make run-e2e）と seeding（make e2e-seed）が uv を使うため先に入れる。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # globalSetup が prd_test_<runId> を seeding → webServer が e2e SPA + FastAPI を起動
      # （E2E_AUTH_BYPASS=1）→ フロー実行 → globalTeardown が物理削除、まで一気通貫で回す。
      - name: Run E2E flows
        run: npm run e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
