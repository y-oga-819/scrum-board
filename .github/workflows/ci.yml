name: CI

# フロントエンド（Angular）とバックエンド（FastAPI）の lint・型チェック・テストを
# push と pull request で実行する CI の基盤。カバレッジ結果は PR にコメントする。
on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ。PR コメントを書くジョブだけ個別に書き込み権限を付ける。
permissions:
  contents: read

# 同一ブランチで新しい push があれば古い実行をキャンセルする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # addopts で term レポートは常に出る。CI では HTML/XML/JSON も出力する。
      - name: Test (pytest + coverage)
        run: uv run pytest --cov-report=html --cov-report=xml --cov-report=json

      # coverage.json から PR コメント用の Markdown 断片を作る。
      - name: Build coverage summary
        if: always()
        run: |
          python3 - <<'PY' > coverage-summary.md
          import json
          t = json.load(open("coverage.json"))["totals"]
          lines = round(t["percent_covered"], 2)
          bc, bn = t.get("covered_branches", 0), t.get("num_branches", 0)
          branches = f"{bc}/{bn}" + (f" ({round(bc / bn * 100)}%)" if bn else "")
          print("### Backend (pytest)\n")
          print("| Metric | Coverage |")
          print("| --- | --- |")
          print(f"| Lines | {lines}% |")
          print(f"| Branches | {branches} |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: backend/coverage-summary.md

  frontend:
    name: Frontend (eslint / tsc / karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      # ChromeHeadlessNoSandbox は Angular ビルダー組み込みのランチャー。
      # root で動く CI では --no-sandbox が必要になる。
      # Chrome は ubuntu-latest ランナーにプリインストールされている。
      # text-summary はコンソールに出るので tee で控えておき、後で解析する。
      - name: Test (Karma/Jasmine + coverage)
        run: |
          npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage \
            2>&1 | tee karma-output.txt

      # Karma の text-summary 出力から PR コメント用の Markdown 断片を作る。
      - name: Build coverage summary
        if: always()
        run: |
          sed -r 's/\x1b\[[0-9;]*m//g' karma-output.txt > karma-clean.txt
          pct() { grep -E "^$1" karma-clean.txt | grep -oE '[0-9.]+%' | head -1; }
          {
            echo "### Frontend (Karma)"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | --- |"
            echo "| Statements | $(pct Statements) |"
            echo "| Branches | $(pct Branches) |"
            echo "| Functions | $(pct Functions) |"
            echo "| Lines | $(pct Lines) |"
          } > coverage-summary.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend/coverage-summary.md

  # OpenAPI から生成した TypeScript 型が最新か検証する（B-12・D-20）。
  # 型を単一の真実（FastAPI の OpenAPI）から生成する以上、生成し忘れをここで弾く。
  # 既存ジョブを書き換えず独立ジョブにしてあるのは、並行開発（テスト基盤の CI 変更）と
  # 衝突させないため。
  types:
    name: Types (OpenAPI → TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate types from OpenAPI
        run: make gen-types

      # 生成物 schema.d.ts に差分が出たら、生成し忘れ（またはスキーマ変更の未反映）。
      - name: Fail if generated types are out of date
        run: |
          if ! git diff --exit-code -- frontend/src/app/api/schema.d.ts; then
            echo "::error::生成 TS 型が最新ではありません。'make gen-types' を実行してコミットしてください。"
            exit 1
          fi

  # 両ジョブのカバレッジ断片をまとめ、PR に貼る（同じコメントを更新する）。
  coverage-comment:
    name: Coverage PR comment
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download backend summary
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-summary
          path: backend-summary

      - name: Download frontend summary
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend-summary

      - name: Post or update coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').trim(); } catch { return '_(no data)_'; } };
            const backend = read('backend-summary/coverage-summary.md');
            const frontend = read('frontend-summary/coverage-summary.md');

            const marker = '<!-- coverage-report -->';
            const body = [
              marker,
              '## 🧪 Coverage report',
              '',
              backend,
              '',
              frontend,
              '',
              `<sub>Updated for ${context.sha.slice(0, 7)}.</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
