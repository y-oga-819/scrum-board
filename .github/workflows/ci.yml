name: CI

# フロントエンド（Angular）とバックエンド（FastAPI）の lint・型チェック・テストを
# push と pull request で実行する CI の基盤。カバレッジは「事実」として PR にコメントする
# （数値ゲートは置かない。D-19／D-23）。
on:
  push:
    branches: [main]
  pull_request:

# 既定は読み取りのみ。PR コメントを書くジョブだけ個別に書き込み権限を付ける。
permissions:
  contents: read

# 同一ブランチで新しい push があれば古い実行をキャンセルする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # patch coverage は「base からの変更行」を要するため全履歴を取る（浅いと merge-base が引けない）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # PR コメントの「事実」を組み立てる scripts/coverage/ の純粋関数を検証する（EX-2/D-23）。
      # stdlib のみなので uv 不要。ここが壊れると Δ・patch coverage が静かに誤る。
      - name: Test coverage report script
        run: python3 -m unittest discover -s ../scripts/coverage/tests -t ../scripts/coverage/tests

      # addopts で term レポートは常に出る。CI では HTML/XML/JSON も出力する。
      - name: Test (pytest + coverage)
        run: uv run pytest --cov-report=html --cov-report=xml --cov-report=json

      # coverage.json と base 差分から、PR コメント用の正規化レポート（totals ＋ Δ ＋
      # 未カバーの変更行）を作る。base_ref は PR のときだけ埋まる（push では totals のみ＝baseline）。
      - name: Build coverage report
        if: always()
        run: |
          BASE=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          fi
          python3 ../scripts/coverage/report.py collect \
            --kind backend --coverage coverage.json \
            --path-prefix backend --base-ref "$BASE" \
            --out coverage-report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov

      # PR コメント（および次回 PR の baseline）が読む正規化レポート。
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage-report.json

  frontend:
    name: Frontend (eslint / tsc / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # backend と同じ理由で全履歴（patch coverage の merge-base）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      # Vitest は jsdom 上で走る（実ブラウザ不要）。code-coverage で totals 用の
      # coverage-summary.json（json-summary）と、patch coverage 用の行単位
      # coverage-final.json（json）と HTML を出力する（angular.json で設定）。
      - name: Test (Vitest + coverage)
        run: npm run coverage

      # backend と同じ正規化レポートを作る。ubuntu-latest には python3 が標準で入るため
      # uv 不要でそのまま走る。istanbul はビルド出力先の絶対パスを吐くので --strip-to src で
      # frontend/src/... に写像してから差分と突き合わせる。
      - name: Build coverage report
        if: always()
        run: |
          BASE=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          fi
          python3 ../scripts/coverage/report.py collect \
            --kind frontend --coverage coverage/coverage-final.json \
            --summary coverage/coverage-summary.json \
            --path-prefix frontend --strip-to src --base-ref "$BASE" \
            --out coverage-report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage-report.json

  # 層3: Cosmos 契約テスト（412／除外パス）。フェイクで通っても本番で壊れる領域だけを
  # エミュレータで裏取りする（D-19）。日常の backend ジョブは Cosmos なしで走るため、
  # 層3を別ジョブに分けて遅さを隔離する。
  cosmos-contract:
    name: Backend Cosmos contract (層3 / emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Linux 版 Cosmos エミュレータ。Python SDK はゲートウェイモード（:8081）で
      # 話すため、契約テストは connection_verify=False で自己署名証明書を許容する。
      - name: Start Cosmos DB emulator
        run: |
          docker run -d --name cosmos-emulator \
            -p 8081:8081 -p 10250-10255:10250-10255 \
            -e AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3 \
            -e AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest

      # 固定 sleep ではなく ready ポーリング（D-19）。エミュレータの証明書
      # エンドポイントが 200 を返した時点で即座に先へ進む。sleep はポーリング
      # 間隔であって「起動を待つ固定待機」ではない。
      - name: Wait for emulator (poll readiness, not fixed sleep)
        run: |
          for i in $(seq 1 60); do
            if curl -ksf https://localhost:8081/_explorer/emulator.pem >/dev/null; then
              echo "emulator ready after ${i} poll(s)"; exit 0
            fi
            echo "polling emulator readiness… (${i}/60)"; sleep 5
          done
          echo "::error::emulator did not become ready in time"
          docker logs cosmos-emulator || true
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      # -m cosmos で層3だけを選ぶ。conftest は env があれば skip せず走る。
      - name: Cosmos contract tests (層3)
        env:
          COSMOS_ENDPOINT: https://localhost:8081
          # エミュレータの周知の固定キー（公開値・秘密ではない）。
          COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
          COSMOS_DATABASE: scrumboard-contract
        run: uv run pytest -m cosmos --no-cov

  # OpenAPI から生成した TypeScript 型が最新か検証する（B-12・D-20）。
  # 型を単一の真実（FastAPI の OpenAPI）から生成する以上、生成し忘れをここで弾く。
  # 既存ジョブを書き換えず独立ジョブにしてあるのは、並行開発（テスト基盤の CI 変更）と
  # 衝突させないため。
  types:
    name: Types (OpenAPI → TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate types from OpenAPI
        run: make gen-types

      # 生成物 schema.d.ts に差分が出たら、生成し忘れ（またはスキーマ変更の未反映）。
      - name: Fail if generated types are out of date
        run: |
          if ! git diff --exit-code -- frontend/src/app/api/schema.d.ts; then
            echo "::error::生成 TS 型が最新ではありません。'make gen-types' を実行してコミットしてください。"
            exit 1
          fi

  # 両ジョブのレポートをまとめ、PR に「事実」を貼る（同じコメントを更新する）。
  # 数値ゲートは置かず、Δ（元の状態→変化）と未カバーの変更行（次の行動）を示す。D-23。
  coverage-comment:
    name: Coverage PR comment
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read # 直近 main run の baseline を取りにいくため
    steps:
      - name: Checkout (report script only)
        uses: actions/checkout@v4

      # このPRの HEAD レポート（各ジョブが上げたもの）。片方が落ちても render は
      # 揃った分だけで組み立てるため、取得失敗は握りつぶす。
      - name: Download backend report (this PR)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage-report
          path: current/backend
      - name: Download frontend report (this PR)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage-report
          path: current/frontend

      # base（main）の直近成功 run を探し、その run のレポートを baseline として取る。
      # 外部SaaS・サードパーティ action に依存せず、自前の artifact だけで Δ を出す。
      - name: Find latest main run
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml',
              branch: 'main', event: 'push', status: 'success', per_page: 1,
            });
            const run = runs.data.workflow_runs[0];
            core.setOutput('run_id', run ? String(run.id) : '');
            core.setOutput('base_sha', run ? run.head_sha : '');

      # 初回（baseline なし）は run_id が空。download を試みず、Δ は「初回」表示になる。
      - name: Download backend baseline
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage-report
          path: baseline/backend
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frontend baseline
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage-report
          path: baseline/frontend
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render coverage comment
        run: |
          python3 scripts/coverage/report.py render \
            --current current/backend/coverage-report.json current/frontend/coverage-report.json \
            --baseline baseline/backend/coverage-report.json baseline/frontend/coverage-report.json \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ steps.baseline.outputs.base_sha }}" \
            --out comment.md

      - name: Post or update coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
