name: Deploy

# B-06 — main への push で App Service に自動デプロイする。
#
# 単一 App Service に同居する構成なので、成果物は 1 つにまとめる:
#   1) Angular SPA をビルド（frontend/dist/frontend/browser）
#   2) バックエンドの依存を uv.lock から requirements.txt に書き出す（Oryx が入れる）
#   3) app/ + requirements.txt + spa/ を 1 パッケージにして zip デプロイ
#
# 認証はシークレットレス（OIDC）。scripts/setup/setup-github-oidc.sh で設定した
# フェデレーション資格情報を使う。保存する秘密は無い。
on:
  push:
    branches: [main]
  # 手動でも流せるようにしておく（Entra 実値の反映後の再デプロイなど）。
  workflow_dispatch:

# OIDC トークンの発行に id-token: write が要る。ソース取得のため contents: read。
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to App Service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ---- フロントエンド: SPA をビルド ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- バックエンド: ロックから requirements.txt を書き出す ----
      # デプロイ先の Oryx は requirements.txt を見る。uv.lock を正として書き出し、
      # 本番サーバ（gunicorn）だけ追記する（ローカル開発は uvicorn 直叩きなので不要）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Export requirements
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          echo "gunicorn>=21.2" >> requirements.txt

      # ---- デプロイ用パッケージを組み立てる ----
      # wwwroot 直下のレイアウト:
      #   app/                アプリ本体（startup の app.main:app が指す）
      #   requirements.txt    Oryx が依存を入れる
      #   spa/browser/        SPA 成果物（SPA_DIST_DIR が指す）
      - name: Assemble deploy package
        run: |
          mkdir -p package/spa
          cp -r backend/app package/app
          cp backend/requirements.txt package/requirements.txt
          cp -r frontend/dist/frontend/browser package/spa/browser

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: package

      - name: Smoke test (/api/health)
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          echo "Waiting for ${url} …"
          # F1 はスリープから起きるのに時間がかかる。最大 ~2 分ポーリングする。
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then echo "✅ health OK"; exit 0; fi
            echo "  ($i/24) HTTP $code — retry in 5s"; sleep 5
          done
          echo "❌ health check failed"; exit 1
