[project]
name = "scrum-board-backend"
version = "0.1.0"
description = "Scrum Board backend (FastAPI). Serves the API and the built Angular SPA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # トークン検証（RS256 署名検証・JWKS の from_jwk）。crypto extra で cryptography が入る。
    "pyjwt[crypto]>=2.8",
    # JWKS の取得（V-1 の鍵をフェッチ）。TestClient も内部で httpx を使う。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
