[project]
name = "scrum-board-backend"
version = "0.1.0"
description = "Scrum Board backend (FastAPI). Serves the API and the built Angular SPA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # トークン検証（RS256 署名検証・JWKS の from_jwk）。crypto extra で cryptography が入る。
    "pyjwt[crypto]>=2.8",
    # JWKS の取得（V-1 の鍵をフェッチ）。TestClient も内部で httpx を使う。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# フロントの Prettier printWidth に合わせて 100。
line-length = 100

# 既定のルールセットはバージョンで揺れるため、CI が決定的になるよう明示する。
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort（import 順）
    "UP",  # pyupgrade（新しい構文への近代化）
    "B",   # flake8-bugbear（バグになりやすい書き方）
]
ignore = [
    # FastAPI では Depends()/Security() をデフォルト引数に置くのが定石。
    "B008",
]

[tool.mypy]
python_version = "3.11"
# app と tests を対象に型チェックする（設定は明示的に、CI と手元で同じ結果に）。
files = ["app", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
