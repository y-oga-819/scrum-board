[project]
name = "scrum-board-backend"
version = "0.1.0"
description = "Scrum Board backend (FastAPI). Serves the API and the built Angular SPA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # トークン検証（RS256 署名検証・JWKS の from_jwk）。crypto extra で cryptography が入る。
    "pyjwt[crypto]>=2.8",
    # JWKS の取得（V-1 の鍵をフェッチ）。TestClient も内部で httpx を使う。
    "httpx>=0.27",
    # データアクセス基盤（B-07）。単一コンテナへの読み書きと _etag 楽観排他。
    # 層1・2 はフェイク Repository で回るため、この SDK は本番と層3のみで使う（D-19）。
    "azure-cosmos>=4.7",
    # 並び替え（B-16）の文字列ランク生成。先頭・末尾・キー枯渇の境界条件を自前で誤ると
    # 順序が静かに壊れるため、実績あるライブラリに委ねる（提案書 06章の設計判断）。
    "fractional-indexing>=0.1.3",
    # 進捗マーカーの営業日計算（B-24）。祝日は春分／秋分・ハッピーマンデー・振替休日・
    # 国民の休日まで正しく扱う必要があり、自前計算だと静かに1日ずれる。実績あるライブラリに
    # 委ねる（fractional-indexing と同じ判断・D-25）。
    "jpholiday>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# デフォルトで app のカバレッジを計測し、未到達行を表示する。
addopts = "--cov=app --cov-report=term-missing"
# 層3（Cosmos 契約）は実サービス相当（エミュレータ）が要る。環境変数が未設定なら
# モジュールごと skip するので、日常の `pytest` は Cosmos なしで緑のまま（D-19）。
markers = [
    "cosmos: 層3 Cosmos 契約テスト。エミュレータ接続（COSMOS_ENDPOINT/KEY）が要る",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py311"
# フロントの Prettier printWidth に合わせて 100。
line-length = 100

# 既定のルールセットはバージョンで揺れるため、CI が決定的になるよう明示する。
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort（import 順）
    "UP",  # pyupgrade（新しい構文への近代化）
    "B",   # flake8-bugbear（バグになりやすい書き方）
]
ignore = [
    # FastAPI では Depends()/Security() をデフォルト引数に置くのが定石。
    "B008",
]

[tool.mypy]
python_version = "3.11"
# app と tests を対象に型チェックする（設定は明示的に、CI と手元で同じ結果に）。
files = ["app", "tests"]

# fractional-indexing（B-16 の文字列ランク生成）は型スタブ（py.typed）を同梱しない。
# 薄いラッパ（app/data/ranking.py）で境界を閉じているため、この 1 モジュールだけ
# 未型付け import を許容する。
[[tool.mypy.overrides]]
module = ["fractional_indexing"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
